	<h1><strong>SINGOLARITA'</strong> <a href="blackHole.html"><img src="depositphotos_253891416-stock-illustration-black-hole-icon-vector-from.jpg" alt="black hole" height="50" width="50"/></a></h1>
	
	<p>Una singolarità gravitazionale è un punto in cui la curvatura dello spaziotempo tende a un valore infinito. Secondo alcune teorie l'evoluzione dell'universo potrebbe avere avuto inizio e finire con singolarità gravitazionali, rispettivamente il Big Bang e il Big Crunch.</p>
