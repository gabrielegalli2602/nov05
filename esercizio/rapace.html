	<h1><strong>RAPACE</strong> <a href="peregrineFalcon.html"><img src="standing-peregrine-falcon-logo-vector.jpg" alt="peregrine falcon" height="50" width="50"/></a></h1>
	
	<p>Un rapace è un tipo di uccello predatore che caccia e si nutre di altri animali. Le caratteristiche principali dei rapaci sono rappresentate dal fatto che cacciano utilizzando il becco e gli artigli e dal fatto di avere un potente senso della vista.</p>
